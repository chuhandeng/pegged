<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="205" viewBox="0 0 1200 205" role="img" aria-labelledby="title desc">
<title id="title">Pegged verdict states</title><desc id="desc">Three glass cards for hang it out, tight watch the sky, and hold off for now.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ff"/><stop offset=".5" stop-color="#f4f0ff"/><stop offset="1" stop-color="#fff2e6"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="11" stdDeviation="14" flood-color="#59728d" flood-opacity=".13"/></filter></defs>
<rect width="1200" height="205" rx="26" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif" filter="url(#s)">
<g transform="translate(35 28)"><rect width="355" height="149" rx="25" fill="#fff" fill-opacity=".65" stroke="#fff"/><circle cx="39" cy="40" r="12" fill="#20a77a"/><text x="68" y="46" font-size="13" font-weight="700" letter-spacing="1.6" fill="#557086">CLEAR WINDOW</text><text x="31" y="91" font-size="28" font-weight="800" fill="#1d765a">Hang it out now.</text><text x="31" y="120" font-size="15" fill="#657d90">Dry soon, with enough room before rain.</text></g>
<g transform="translate(423 28)"><rect width="355" height="149" rx="25" fill="#fff" fill-opacity=".65" stroke="#fff"/><circle cx="39" cy="40" r="12" fill="#f0b45d"/><text x="68" y="46" font-size="13" font-weight="700" letter-spacing="1.6" fill="#557086">CLOSE CALL</text><text x="31" y="91" font-size="28" font-weight="800" fill="#9a6b24">Tight. Watch the sky.</text><text x="31" y="120" font-size="15" fill="#657d90">It can dry, but the margin before rain is small.</text></g>
<g transform="translate(810 28)"><rect width="355" height="149" rx="25" fill="#fff" fill-opacity=".65" stroke="#fff"/><circle cx="39" cy="40" r="12" fill="#5b9de8"/><text x="68" y="46" font-size="13" font-weight="700" letter-spacing="1.6" fill="#557086">BAD WINDOW</text><text x="31" y="91" font-size="28" font-weight="800" fill="#4d78a8">Hold off for now.</text><text x="31" y="120" font-size="15" fill="#657d90">Over 24h or rain interrupts the current run.</text></g>
</g></svg>
